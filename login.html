<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Tabarak Mega Mall</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="bg-slate-900 min-h-screen flex items-center justify-center p-4">

    <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl p-8 border border-slate-100 relative">
        <!-- Logo & Branding -->
        <div class="text-center mb-6">
            <img src="logo mall.jpg" alt="Tabarak Logo" class="h-14 w-auto mx-auto object-contain mb-3" onerror="this.onerror=null; this.style.display='none';">
            <h2 class="text-2xl font-black text-slate-900 tracking-tight">Management Portal</h2>
            <p class="text-xs text-slate-500 font-semibold mt-1">Tabarak Mega Mall Karianwala</p>
        </div>

        <!-- Alert Message -->
        <div id="alertBox" class="hidden mb-4 p-3 rounded-2xl text-xs font-bold flex items-center gap-2">
            <i id="alertIcon" class="fa-solid text-base"></i>
            <span id="alertMessage"></span>
        </div>

        <!-- Main Login Form -->
        <form onsubmit="handleLogin(event)" class="space-y-4">
            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Username / Email</label>
                <div class="relative">
                    <input type="text" id="username" required placeholder="admin or admin@tabarak.com" class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium">
                    <i class="fa-solid fa-envelope absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                </div>
            </div>

            <div>
                <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Password</label>
                <div class="relative">
                    <input type="password" id="password" required placeholder="••••••••" class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 font-medium">
                    <i class="fa-solid fa-lock absolute left-3.5 top-3.5 text-slate-400 text-xs"></i>
                </div>
                <div class="text-right mt-1.5">
                    <button type="button" onclick="openForgetModal()" class="text-xs font-bold text-emerald-600 hover:underline">Forgot Password?</button>
                </div>
            </div>

            <button type="submit" id="loginBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3 rounded-xl transition shadow-lg shadow-emerald-600/20 flex items-center justify-center gap-2 text-sm">
                <i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard
            </button>
        </form>

        <div class="mt-6 border-t pt-4 text-center">
            <a href="index.html" class="text-xs font-bold text-slate-400 hover:text-emerald-600 transition inline-flex items-center gap-1">
                <i class="fa-solid fa-arrow-left"></i> Back to Main Store
            </a>
        </div>
    </div>

    <!-- 2-Step OTP Reset Password Modal -->
    <div id="forgetModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 shadow-2xl relative">
            <div class="flex justify-between items-center border-b pb-3 mb-4">
                <h3 class="font-black text-slate-900 text-base">OTP Password Reset</h3>
                <button onclick="closeForgetModal()" class="text-slate-400 hover:text-slate-600 font-bold">&times;</button>
            </div>

            <!-- STEP 1: Enter Email to Receive OTP -->
            <form id="otpStep1Form" onsubmit="handleSendOtp(event)" class="space-y-4">
                <p class="text-xs text-slate-500">Enter your registered admin email address to receive a 6-digit OTP code.</p>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Email Address</label>
                    <input type="email" id="resetEmail" required placeholder="admin@tabarak.com" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" id="sendOtpBtn" class="w-full bg-slate-900 hover:bg-emerald-600 text-white font-bold py-2.5 rounded-xl text-xs transition">
                    Send OTP Verification Code
                </button>
            </form>

            <!-- STEP 2: Verify OTP & Reset Password (Hidden by default) -->
            <form id="otpStep2Form" onsubmit="handleVerifyReset(event)" class="space-y-4 hidden">
                <p class="text-xs text-emerald-600 font-bold">✅ OTP Code has been sent to your email! Enter it below:</p>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">6-Digit OTP Code</label>
                    <input type="text" id="otpCode" maxlength="6" required placeholder="123456" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm font-mono tracking-widest text-center focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">New Password</label>
                    <input type="password" id="newPass" required placeholder="••••••••" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>
                <button type="submit" id="verifyBtn" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-2.5 rounded-xl text-xs transition">
                    Verify OTP & Reset Password
                </button>
            </form>
        </div>
    </div>

    <!-- Live API Logic Script -->
    <script>
        const API_URL = "http://localhost:5000/api/auth";

        if (localStorage.getItem('adminToken')) {
            window.location.href = "admin.html";
        }

        function showAlert(msg, isSuccess = false) {
            const alertBox = document.getElementById('alertBox');
            const alertMsg = document.getElementById('alertMessage');
            const alertIcon = document.getElementById('alertIcon');

            alertMsg.innerText = msg;
            alertBox.className = isSuccess 
                ? "mb-4 p-3 rounded-2xl text-xs font-bold flex items-center gap-2 bg-emerald-50 border border-emerald-200 text-emerald-700"
                : "mb-4 p-3 rounded-2xl text-xs font-bold flex items-center gap-2 bg-rose-50 border border-rose-200 text-rose-700";
            
            alertIcon.className = isSuccess ? "fa-solid fa-circle-check text-base" : "fa-solid fa-circle-exclamation text-base";
            alertBox.classList.remove('hidden');
        }

        async function handleLogin(e) {
            e.preventDefault();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();
            const loginBtn = document.getElementById('loginBtn');

            loginBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Authenticating...';
            loginBtn.disabled = true;

            try {
                const response = await fetch(`${API_URL}/login`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });

                const data = await response.json();

                if (response.ok) {
                    localStorage.setItem('adminToken', data.token);
                    localStorage.setItem('adminUser', JSON.stringify(data.user));
                    
                    showAlert("✅ Login Successful! Redirecting...", true);
                    setTimeout(() => { window.location.href = "admin.html"; }, 800);
                } else {
                    showAlert(data.message || "Invalid Username or Password!");
                }
            } catch (err) {
                showAlert("❌ Unable to connect to server! Make sure node app.js is running.");
            } finally {
                loginBtn.innerHTML = '<i class="fa-solid fa-right-to-bracket"></i> Login to Dashboard';
                loginBtn.disabled = false;
            }
        }

        // Send OTP
        async function handleSendOtp(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            const btn = document.getElementById('sendOtpBtn');

            btn.innerText = "Sending OTP Email...";
            btn.disabled = true;

            try {
                const res = await fetch(`${API_URL}/send-otp`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email })
                });
                const data = await res.json();

                if (res.ok) {
                    document.getElementById('otpStep1Form').classList.add('hidden');
                    document.getElementById('otpStep2Form').classList.remove('hidden');
                } else {
                    showAlert("❌ " + data.message);
                }
            } catch (err) {
                alert("❌ Server Connection Error!");
            } finally {
                btn.innerText = "Send OTP Verification Code";
                btn.disabled = false;
            }
        }

        // Verify OTP & Reset Password
        async function handleVerifyReset(e) {
            e.preventDefault();
            const email = document.getElementById('resetEmail').value.trim();
            const otp = document.getElementById('otpCode').value.trim();
            const newPassword = document.getElementById('newPass').value.trim();

            try {
                const res = await fetch(`${API_URL}/verify-reset`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, otp, newPassword })
                });
                const data = await res.json();

                if (res.ok) {
                    alert("✅ Password Reset Successful! Login with your new password.");
                    closeForgetModal();
                } else {
                    alert("❌ " + data.message);
                }
            } catch (err) {
                alert("❌ Failed to reset password.");
            }
        }

        function openForgetModal() {
            document.getElementById('forgetModal').classList.remove('hidden');
            document.getElementById('otpStep1Form').classList.remove('hidden');
            document.getElementById('otpStep2Form').classList.add('hidden');
        }

        function closeForgetModal() {
            document.getElementById('forgetModal').classList.add('hidden');
        }
    </script>
</body>
</html>
