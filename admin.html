<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard | Tabarak Mega Mall</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Auth Guard: Login Check -->
    <script>
        if (sessionStorage.getItem('tabarak_admin_logged_in') !== 'true') {
            window.location.href = "login.html";
        }
    </script>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Top Navigation Header -->
    <header class="bg-slate-900 text-white sticky top-0 z-40 shadow-md">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <img src="logo mall.jpg" alt="Tabarak Logo" class="h-10 w-auto object-contain rounded-md bg-white p-1" onerror="this.onerror=null; this.style.display='none';">
                <div>
                    <h1 class="text-lg font-black tracking-wide text-emerald-400">TABARAK MEGA MALL</h1>
                    <p class="text-[10px] text-slate-400 uppercase tracking-widest font-semibold">Store Management Portal</p>
                </div>
            </div>
            
            <div class="flex items-center gap-3">
                <a href="index.html" target="_blank" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-2">
                    <i class="fa-solid fa-store"></i> View Live Store
                </a>
                <button onclick="handleLogout()" class="bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-4 py-2 rounded-xl transition flex items-center gap-2 shadow-sm">
                    <i class="fa-solid fa-right-from-bracket"></i> Logout
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-1 w-full">
        
        <!-- Dashboard Stats Overview -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-6 mb-8">
            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-emerald-100 text-emerald-700 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-boxes-stacked"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-slate-400 uppercase">Total Products</span>
                    <h3 id="statTotalProducts" class="text-2xl font-black text-slate-800">0</h3>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-amber-100 text-amber-700 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-slate-400 uppercase">Active Categories</span>
                    <h3 id="statCategories" class="text-2xl font-black text-slate-800">6</h3>
                </div>
            </div>

            <div class="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm flex items-center gap-4">
                <div class="w-12 h-12 rounded-2xl bg-sky-100 text-sky-700 flex items-center justify-center text-xl">
                    <i class="fa-solid fa-shield-halved"></i>
                </div>
                <div>
                    <span class="text-xs font-bold text-slate-400 uppercase">System Status</span>
                    <h3 class="text-lg font-black text-emerald-600">Online / Sync Active</h3>
                </div>
            </div>
        </div>

        <!-- Action Bar: Add Product & Search -->
        <div class="flex flex-col sm:flex-row justify-between items-center gap-4 mb-6">
            <div class="relative w-full sm:w-72">
                <input type="text" id="adminSearch" onkeyup="filterAdminTable()" placeholder="Search products..." class="w-full pl-10 pr-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white shadow-sm">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3.5 text-slate-400 text-xs"></i>
            </div>

            <button onclick="openProductModal()" class="w-full sm:w-auto bg-slate-900 hover:bg-emerald-700 text-white px-6 py-2.5 rounded-xl font-bold text-sm transition flex items-center justify-center gap-2 shadow-sm">
                <i class="fa-solid fa-plus"></i> Add New Product
            </button>
        </div>

        <!-- Products Table -->
        <div class="bg-white rounded-2xl shadow-sm border border-slate-200 overflow-hidden">
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-slate-50 border-b border-slate-200 text-slate-500 text-xs font-bold uppercase tracking-wider">
                            <th class="py-4 px-6">Product</th>
                            <th class="py-4 px-6">Category</th>
                            <th class="py-4 px-6">Price</th>
                            <th class="py-4 px-6">Original Price</th>
                            <th class="py-4 px-6 text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="adminTableBody" class="divide-y divide-slate-100 text-sm font-medium">
                        <!-- Rendered dynamically -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- Modal Form (Add / Edit Product) -->
    <div id="productModal" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl max-w-lg w-full p-6 shadow-2xl border border-slate-100 relative max-h-[90vh] overflow-y-auto">
            <div class="flex justify-between items-center border-b pb-4 mb-4">
                <h3 id="modalTitle" class="font-black text-lg text-slate-900">Add New Product</h3>
                <button onclick="closeProductModal()" class="text-slate-400 hover:text-slate-600 text-xl font-bold">&times;</button>
            </div>

            <form id="productForm" onsubmit="saveProduct(event)" class="space-y-4">
                <input type="hidden" id="editProductId">

                <div>
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Product Title</label>
                    <input type="text" id="prodName" required placeholder="e.g., Premium Cooking Oil (5L)" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Category</label>
                        <select id="prodCategory" required class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                            <option value="grocery">Grocery</option>
                            <option value="kitchen">Kitchen</option>
                            <option value="frozen">Frozen</option>
                            <option value="toys">Toys</option>
                            <option value="cosmetics">Cosmetics</option>
                            <option value="household">Household</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Sale Price (Rs.)</label>
                        <input type="number" id="prodPrice" required placeholder="2450" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Old Price (Rs.) <span class="text-slate-400 font-normal lowercase">(optional)</span></label>
                        <input type="number" id="prodOldPrice" placeholder="2600" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                    </div>
                    <div>
                        <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Image Source</label>
                        <select id="imageSourceType" onchange="toggleImageInputType()" class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500 bg-white">
                            <option value="file">📁 Gallery / Device</option>
                            <option value="url">🔗 Web Link URL</option>
                        </select>
                    </div>
                </div>

                <!-- Gallery File Picker Section -->
                <div id="fileUploadContainer">
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Upload Image from Gallery</label>
                    <input type="file" id="prodFile" accept="image/*" onchange="handleFileSelect(event)" class="w-full text-xs text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-xl file:border-0 file:text-xs file:font-bold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 border border-slate-300 rounded-xl cursor-pointer">
                </div>

                <!-- Web URL Input Section (Hidden by default) -->
                <div id="urlUploadContainer" class="hidden">
                    <label class="block text-xs font-bold text-slate-600 uppercase mb-1">Image URL</label>
                    <input type="url" id="prodImg" placeholder="https://..." class="w-full px-4 py-2.5 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
                </div>

                <!-- Preview Image Box -->
                <div class="flex items-center gap-3 bg-slate-50 p-3 rounded-2xl border border-slate-200">
                    <img id="imagePreview" src="https://images.unsplash.com/photo-1542838132-92c53300491e?w=150" alt="Preview" class="w-12 h-12 rounded-lg object-cover bg-white border border-slate-200">
                    <span class="text-xs text-slate-500">Image Preview</span>
                </div>

                <div class="flex justify-end gap-3 pt-4 border-t">
                    <button type="button" onclick="closeProductModal()" class="px-5 py-2.5 border border-slate-300 rounded-xl text-xs font-bold text-slate-600 hover:bg-slate-100 transition">Cancel</button>
                    <button type="submit" class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold transition shadow-md">Save Product</button>
                </div>
            </form>
        </div>
    </div>

    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        © Tabarak Mega Mall Admin Panel | Control Center
    </footer>

    <!-- JavaScript CRUD Engine -->
    <script>
        function handleLogout() {
            sessionStorage.removeItem('tabarak_admin_logged_in');
            window.location.href = "login.html";
        }

        let defaultProducts = [
            { id: 1, name: "Premium Cooking Oil (5L)", category: "grocery", price: 2450, oldPrice: 2600, img: "https://images.unsplash.com/photo-1474979266404-7eaacbcd87c5?w=500" },
            { id: 2, name: "Super Basmati Rice (5 Kg)", category: "grocery", price: 1850, oldPrice: 2000, img: "https://images.unsplash.com/photo-1586201375761-83865001e31c?w=500" },
            { id: 3, name: "Non-Stick Cookware Set (8 Pcs)", category: "kitchen", price: 6800, oldPrice: 7500, img: "https://images.unsplash.com/photo-1584992236310-6edddc08acff?w=500" },
            { id: 4, name: "Chicken Nuggets Pack (1 Kg)", category: "frozen", price: 1150, oldPrice: 1300, img: "https://images.unsplash.com/photo-1562967914-608f82629710?w=500" }
        ];

        let adminProducts = JSON.parse(localStorage.getItem('tabarak_products')) || defaultProducts;
        let currentUploadedImageBase64 = "";

        function saveToStorage() {
            localStorage.setItem('tabarak_products', JSON.stringify(adminProducts));
            renderAdminTable(adminProducts);
        }

        function renderAdminTable(items) {
            const tbody = document.getElementById('adminTableBody');
            document.getElementById('statTotalProducts').innerText = items.length;

            if (items.length === 0) {
                tbody.innerHTML = `<tr><td colspan="5" class="py-8 text-center text-slate-400">No products found in inventory.</td></tr>`;
                return;
            }

            tbody.innerHTML = items.map(p => `
                <tr class="hover:bg-slate-50/80 transition border-b border-slate-100">
                    <td class="py-3 px-6 flex items-center gap-3">
                        <img src="${p.img}" alt="${p.name}" class="w-10 h-10 rounded-lg object-cover bg-slate-100" onerror="this.src='https://images.unsplash.com/photo-1542838132-92c53300491e?w=150';">
                        <span class="font-bold text-slate-800">${p.name}</span>
                    </td>
                    <td class="py-3 px-6">
                        <span class="bg-emerald-50 text-emerald-700 text-[10px] font-extrabold px-2.5 py-1 rounded-md uppercase">${p.category}</span>
                    </td>
                    <td class="py-3 px-6 font-bold text-emerald-800">Rs. ${p.price.toLocaleString()}</td>
                    <td class="py-3 px-6 text-slate-400 line-through">${p.oldPrice ? 'Rs. ' + p.oldPrice.toLocaleString() : '-'}</td>
                    <td class="py-3 px-6 text-right space-x-2">
                        <button onclick="editProduct(${p.id})" class="p-2 text-slate-600 hover:text-emerald-600 transition"><i class="fa-solid fa-pen-to-square"></i></button>
                        <button onclick="deleteProduct(${p.id})" class="p-2 text-slate-600 hover:text-rose-600 transition"><i class="fa-solid fa-trash"></i></button>
                    </td>
                </tr>
            `).join('');
        }

        function toggleImageInputType() {
            const type = document.getElementById('imageSourceType').value;
            if (type === 'file') {
                document.getElementById('fileUploadContainer').classList.remove('hidden');
                document.getElementById('urlUploadContainer').classList.add('hidden');
            } else {
                document.getElementById('fileUploadContainer').classList.add('hidden');
                document.getElementById('urlUploadContainer').classList.remove('hidden');
            }
        }

        function handleFileSelect(event) {
            const file = event.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    currentUploadedImageBase64 = e.target.result;
                    document.getElementById('imagePreview').src = currentUploadedImageBase64;
                };
                reader.readAsDataURL(file);
            }
        }

        function openProductModal() {
            document.getElementById('modalTitle').innerText = "Add New Product";
            document.getElementById('productForm').reset();
            document.getElementById('editProductId').value = "";
            currentUploadedImageBase64 = "";
            document.getElementById('imagePreview').src = "https://images.unsplash.com/photo-1542838132-92c53300491e?w=150";
            toggleImageInputType();
            document.getElementById('productModal').classList.remove('hidden');
        }

        function closeProductModal() {
            document.getElementById('productModal').classList.add('hidden');
        }

        function saveProduct(e) {
            e.preventDefault();
            const id = document.getElementById('editProductId').value;
            const name = document.getElementById('prodName').value;
            const category = document.getElementById('prodCategory').value;
            const price = parseInt(document.getElementById('prodPrice').value);
            
            const rawOldPrice = document.getElementById('prodOldPrice').value;
            const oldPrice = rawOldPrice ? parseInt(rawOldPrice) : null;
            
            const sourceType = document.getElementById('imageSourceType').value;

            let finalImage = "";
            if (sourceType === 'file') {
                finalImage = currentUploadedImageBase64 || "https://images.unsplash.com/photo-1542838132-92c53300491e?w=500";
            } else {
                finalImage = document.getElementById('prodImg').value || "https://images.unsplash.com/photo-1542838132-92c53300491e?w=500";
            }

            if (id) {
                // Update Product
                const index = adminProducts.findIndex(p => p.id == id);
                if (index !== -1) {
                    adminProducts[index] = { id: parseInt(id), name, category, price, oldPrice, img: finalImage };
                }
            } else {
                // Add New Product
                const newId = Date.now();
                adminProducts.push({ id: newId, name, category, price, oldPrice, img: finalImage });
            }

            saveToStorage();
            closeProductModal();
        }

        function editProduct(id) {
            const product = adminProducts.find(p => p.id == id);
            if (!product) return;

            document.getElementById('modalTitle').innerText = "Edit Product";
            document.getElementById('editProductId').value = product.id;
            document.getElementById('prodName').value = product.name;
            document.getElementById('prodCategory').value = product.category;
            document.getElementById('prodPrice').value = product.price;
            document.getElementById('prodOldPrice').value = product.oldPrice ? product.oldPrice : "";
            
            currentUploadedImageBase64 = product.img;
            document.getElementById('imagePreview').src = product.img;

            if (product.img && product.img.startsWith('data:image')) {
                document.getElementById('imageSourceType').value = 'file';
            } else {
                document.getElementById('imageSourceType').value = 'url';
                document.getElementById('prodImg').value = product.img;
            }

            toggleImageInputType();
            document.getElementById('productModal').classList.remove('hidden');
        }

        function deleteProduct(id) {
            if (confirm("Are you sure you want to delete this product?")) {
                adminProducts = adminProducts.filter(p => p.id != id);
                saveToStorage();
            }
        }

        function filterAdminTable() {
            const query = document.getElementById('adminSearch').value.toLowerCase();
            const filtered = adminProducts.filter(p => p.name.toLowerCase().includes(query) || p.category.toLowerCase().includes(query));
            renderAdminTable(filtered);
        }

        renderAdminTable(adminProducts);
    </script>
</body>
</html>
